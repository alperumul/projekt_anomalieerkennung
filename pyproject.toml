[project]
name = "bad-nauheim-anomaly-detection"
version = "0.1.0"
description = "Reproducible data foundation for the Bad Nauheim anomaly-detection study"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas==3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
